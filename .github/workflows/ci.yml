name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest ruff fastapi httpx "uvicorn[standard]" pydantic
      - name: Lint
        run: ruff check core cli api tests benchmarks
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npx oxlint src
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build
